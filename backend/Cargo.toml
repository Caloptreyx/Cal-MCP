axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
compact_str = { workspace = true }
garde = { workspace = true }
hex = { workspace = true }
regex = { workspace = true }
rand = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
